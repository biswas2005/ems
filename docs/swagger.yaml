definitions:
  project.Department:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  project.Employee:
    properties:
      created_at:
        type: string
      department_id:
        type: integer
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      salary:
        type: number
      status:
        type: string
    type: object
  project.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
info:
  contact: {}
paths:
  /departments:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/project.Department'
            type: array
        "500":
          description: Server error
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Get all departments
      tags:
      - Departments
    post:
      consumes:
      - application/json
      description: Creates a new department
      parameters:
      - description: Department data
        in: body
        name: department
        required: true
        schema:
          $ref: '#/definitions/project.Department'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Department'
        "400":
          description: Validation error
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Create department
      tags:
      - Departments
  /employees:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/project.Employee'
            type: array
        "500":
          description: Server error
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Get all employees
      tags:
      - Employees
    post:
      consumes:
      - application/json
      description: Creates a new employee
      parameters:
      - description: Employee data
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/project.Employee'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Employee'
        "400":
          description: Validation error
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Create employee
      tags:
      - Employees
  /employees/{id}:
    delete:
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Deleted successfully
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Delete employee
      tags:
      - Employees
    get:
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Employee'
        "404":
          description: Not found
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Get employee by ID
      tags:
      - Employees
    put:
      consumes:
      - application/json
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      - description: Employee data
        in: body
        name: employee
        required: true
        schema:
          $ref: '#/definitions/project.Employee'
      produces:
      - application/json
      responses:
        "200":
          description: Updated successfully
          schema:
            type: string
        "400":
          description: Validation error
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Update employee
      tags:
      - Employees
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates admin and sets access & refresh token cookies
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            type: string
        "400":
          description: Invalid JSON
          schema:
            type: string
        "401":
          description: Invalid credentials
          schema:
            type: string
      summary: Login admin
      tags:
      - Auth
  /logout:
    post:
      description: Invalidates access token and clears cookies
      responses:
        "200":
          description: Logged out successfully
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - CookieAuth: []
      summary: Logout user
      tags:
      - Auth
swagger: "2.0"
